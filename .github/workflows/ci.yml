# Runs the offline verification suite on every push and pull request.
name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 26.12 and npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'
          package-manager-cache: false

      - name: Ensure test prerequisites
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep ffmpeg
          fi
          command -v rg
          command -v ffmpeg
          command -v flock

      - name: Install package dependencies
        run: |
          set -euo pipefail
          for package in packages/*; do
            echo "Installing ${package}"
            npm --prefix "${package}" install --ignore-scripts --legacy-peer-deps \
              --workspaces=false --no-package-lock --no-fund --no-audit
          done

      - name: Install the development Pi host and link peers
        run: |
          set -euo pipefail
          npm install -g @earendil-works/pi-coding-agent@1.5.0 --ignore-scripts --no-fund --no-audit
          npm run link-host

      - name: Verify the full suite
        run: PI_OFFLINE=1 npm run verify
